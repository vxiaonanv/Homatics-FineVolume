name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not installed on runner"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Homatics-FineVolume-1.2-validation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
